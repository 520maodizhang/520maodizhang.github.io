<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛地张的复古桌面</title>
  <meta name="description" content="Windows XP 风格桌面 × Y2K 霓虹 × 二次元手账">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <!-- CRT 扫描线 -->
  <div class="crt-scanlines"></div>
  <div class="crt-vignette"></div>

  <!-- Boot 画面 -->
  <div id="boot" class="boot">
    <pre class="boot-art">
  __  __    _    ____   ___ _____
 |  \/  |  / \  / ___| / _ \_   _|
 | |\/| | / _ \| |  _ | | | || |
 | |  | |/ ___ \ |_| || |_| || |
 |_|  |_/_/   \_\____| \___/ |_|
    </pre>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    <p class="boot-text">Retro OS starting...</p>
  </div>

  <!-- 桌面 -->
  <div id="desktop" class="desktop hidden">
    <!-- 樱花雨 -->
    <div class="sakura-rain" id="sakura"></div>

    <!-- 桌面图标区 -->
    <div class="icon-area" id="icon-area"></div>

    <!-- 窗口容器 -->
    <div id="windows"></div>

    <!-- 桌宠 -->
    <div class="pet" id="pet">
      <span class="pet-sprite">🐷</span>
      <div class="pet-bubble hidden" id="pet-bubble"></div>
    </div>

    <!-- 任务栏 -->
    <div class="taskbar">
      <button class="start-btn" id="start-btn">
        <span class="start-flag">🪟</span>
        <span class="start-text">start</span>
      </button>
      <div class="taskbar-windows" id="taskbar-windows"></div>
      <div class="system-tray">
        <span class="tray-icon">🔊</span>
        <span class="tray-clock" id="clock">12:00 PM</span>
      </div>
    </div>

    <!-- 开始菜单 -->
    <div class="start-menu hidden" id="start-menu">
      <div class="start-header">
        <div class="start-avatar">🐱</div>
        <span class="start-username">毛地张</span>
      </div>
      <div class="start-body">
        <div class="start-left" id="start-programs"></div>
        <div class="start-right">
          <div class="start-place" data-window="blog">📁 我的文档</div>
          <div class="start-place" data-window="works">🖼️ 图片收藏</div>
          <div class="start-place" data-window="music">🎵 我的音乐</div>
          <div class="start-place" data-window="links">🌐 收藏夹</div>
        </div>
      </div>
      <div class="start-footer">
        <button class="start-footer-btn" id="shutdown-btn">⏻ 关机</button>
      </div>
    </div>
  </div>

  <!-- 关机 -->
  <div id="shutdown" class="shutdown hidden">
    <p class="shutdown-text">It is now safe to turn off your computer.</p>
    <button class="restart-btn" onclick="location.reload()">重新启动</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
